<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050505"/>
      <stop offset="50%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#0d0208"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Туман -->
  <ellipse cx="200" cy="500" rx="300" ry="150" fill="#0d0d15" opacity="0.6"/>
  <ellipse cx="1000" cy="150" rx="250" ry="120" fill="#0a0a10" opacity="0.5"/>
  
  <!-- Деревья -->
  <path d="M50 630 L70 400 L90 630" fill="#0a0a0a"/>
  <path d="M1100 630 L1120 350 L1140 630" fill="#0a0a0a"/>
  
  <!-- Пентаграмма -->
  <path d="M600 200 L620 280 L700 280 L640 330 L660 410 L600 360 L540 410 L560 330 L500 280 L580 280 Z" fill="none" stroke="#1a0a0a" stroke-width="2"/>
  
  <!-- Текст -->
  <text x="600" y="480" font-family="Georgia, serif" font-size="48" fill="#333" text-anchor="middle" letter-spacing="8">СИЛЬНЕЙШАЯ ЧЁРНАЯ МАГИЯ</text>
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="#222" text-anchor="middle" letter-spacing="12">ФАТИМА</text>
  
  <!-- Рамка -->
